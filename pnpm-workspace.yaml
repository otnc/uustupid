packages:
  - pkg
  - pages

catalog:
  '@astrojs/check': ^0.9.6
  '@astrojs/sitemap': ^3.7.3
  '@eslint/js': ^10.0.1
  '@sapphire/shapeshift': ^5.0.0
  '@types/is-uuid': ^1.0.2
  '@types/node': ^22.20.1
  '@types/validator': ^13.15.10
  '@vitest/coverage-v8': ^4.1.11
  arktype: ^2.2.3
  astro: ^7.2.4
  eslint: ^10.8.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-astro: ^3.1.0
  fastest-validator: ^1.19.1
  globals: ^17.11.0
  prettier: ^3.9.6
  prettier-plugin-astro: ^0.14.1
  tsdown: ^0.22.14
  typescript: ^6.0.3
  typescript-eslint: ^8.67.0
  is-uuid: ^1.0.2
  uuid: ^14.0.2
  validator: ^13.15.35
  vitest: ^4.1.11
  yup: ^1.7.1
